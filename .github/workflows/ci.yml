# CI for Chad Aura Tycoon (docs/deploy.md, "CI/CD").
# Every pull request and every push to a branch other than main: format, lint, type-check, unit tests and the place
# build (scripts/check.sh). Pushes to main run the same checks inside deploy.yml before publishing. A green run
# for a pull request lets automerge.yml merge that PR into main.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: tools/ci-install-tools.sh

      - name: Check, test and build
        run: scripts/check.sh

      - name: Upload place file
        # A convenience copy: a full artifact quota must not fail the checks or the deploy.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: place-${{ github.sha }}
          path: build/ChadAuraTycoon.rbxlx
          retention-days: 14
          if-no-files-found: error
