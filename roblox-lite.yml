# Minimal Roblox globals for selene (used because the full API-dump based std
# needs network access to Roblox's CDN). Type correctness is checked separately
# by luau-lsp against the full Roblox definitions (see scripts/check.sh).
base: luau
name: roblox-lite
globals:
  game:
    any: true
  workspace:
    any: true
  script:
    any: true
  plugin:
    any: true
  shared:
    any: true
  Instance:
    any: true
  Vector3:
    any: true
  Vector2:
    any: true
  CFrame:
    any: true
  Color3:
    any: true
  ColorSequence:
    any: true
  ColorSequenceKeypoint:
    any: true
  NumberSequence:
    any: true
  NumberSequenceKeypoint:
    any: true
  NumberRange:
    any: true
  UDim:
    any: true
  UDim2:
    any: true
  Enum:
    any: true
  TweenInfo:
    any: true
  Random:
    any: true
  Rect:
    any: true
  Region3:
    any: true
  Ray:
    any: true
  RaycastParams:
    any: true
  OverlapParams:
    any: true
  BrickColor:
    any: true
  PhysicalProperties:
    any: true
  Font:
    any: true
  Axes:
    any: true
  Faces:
    any: true
  DateTime:
    any: true
  task:
    any: true
  typeof:
    any: true
  tick:
    any: true
  warn:
    any: true
  elapsedTime:
    any: true
  time:
    any: true
  wait:
    any: true
  delay:
    any: true
  spawn:
    any: true
  settings:
    any: true
  UserSettings:
    any: true
  debug:
    any: true
  utf8:
    any: true
  buffer:
    any: true
